[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaidoc"
version = "0.4.0"
description = "Zero-annotation, living HTML documentation for AI function calls and agent tools in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mario Schiller" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pyaidoc = "pyaidoc.cli.__main__:main"

[project.entry-points."pyresponse.commands"]
ai_tools = "pyaidoc.cli.ai_tools:AiToolsCommand"
ai_docs = "pyaidoc.cli.ai_docs:AiDocsCommand"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
